<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donation History – BloodConnect</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header id="main-header"></header>

  <main class="dashboard-main">

    <div class="page-header">
      <h1>📋 My Donation History</h1>
      <a href="../donor/dashboard.html" class="btn btn-outline btn-sm">← Dashboard</a>
    </div>

    <!-- Cooldown status -->
    <div id="cooldown-banner" class="card hidden">
      <h2>⏳ Current Cooldown</h2>
      <p id="cooldown-info"></p>
    </div>

    <!-- History table -->
    <div class="card table-card">
      <div id="history-loading" class="loading-state">Loading…</div>
      <div id="history-empty" class="empty-state hidden">
        <p>No donations recorded yet. Keep donating! 💪</p>
      </div>
      <div class="table-responsive hidden" id="history-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Date</th>
              <th>Recipient</th>
              <th>Blood Group</th>
              <th>Hospital</th>
              <th>Units</th>
              <th>Certificate</th>
            </tr>
          </thead>
          <tbody id="history-tbody"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/donor-history.js"></script>
</body>
</html>
