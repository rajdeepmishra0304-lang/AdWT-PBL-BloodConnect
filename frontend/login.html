<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – BloodConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <header id="main-header"></header>

  <main class="auth-container">
    <div class="auth-card card">
      <div class="auth-logo">🩸 BloodConnect</div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle text-muted">Sign in to your account</p>

      <form id="login-form" novalidate>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control"
                 placeholder="you@example.com" required autocomplete="email">
          <span class="form-error" id="err-email"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="••••••••" required autocomplete="current-password">
          <span class="form-error" id="err-password"></span>
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary btn-full">
          Sign In
        </button>

        <div class="auth-footer">
          <span>Don't have an account?</span>
          <a href="register.html">Register here</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
