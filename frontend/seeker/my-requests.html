<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blood Requests – BloodConnect</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header id="main-header"></header>

  <main class="dashboard-main">

    <div class="page-header">
      <h1>📋 My Blood Requests</h1>
      <div>
        <a href="../seeker-request.html" class="btn btn-danger btn-sm">🆘 New Request</a>
        <a href="../seeker/dashboard.html" class="btn btn-outline btn-sm">← Dashboard</a>
      </div>
    </div>

    <div class="card table-card">
      <div id="requests-loading" class="loading-state">Loading…</div>
      <div id="requests-empty" class="empty-state hidden">
        <p>No requests found. <a href="../seeker-request.html">Create your first emergency request!</a></p>
      </div>
      <div class="table-responsive hidden" id="requests-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Patient</th>
              <th>Blood Group</th>
              <th>Units</th>
              <th>Hospital</th>
              <th>Doctor</th>
              <th>Urgency</th>
              <th>Status</th>
              <th>Created</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="requests-tbody"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/seeker-requests.js"></script>
</body>
</html>
